# GitHub Secret Scanning 配置（仓库级）
# 文档：https://docs.github.com/en/code-security/secret-scanning/configuring-secret-scanning-for-your-repository
#
# 背景：本仓库的支付 / TLS 测试会在运行时即时生成 RSA 私钥与平台证书，并使用
# 「形似凭据」的占位夹具（如微信 APIv3 密钥必须 32 字节 → 夹具 "k" * 32）。
# 这些值由 rsa.generate_private_key() / x509.random_serial_number() 每次测试重新生成、
# 绝不落库，但 GitHub secret scanning 的 partner 模式只按「关键字上下文 + 长度」匹配，
# 会把它们误判成真实的腾讯微信支付令牌（实际已核实：全历史 100 个 commit 从未提交过任何真实凭据）。
#
# 这里排除的三个文件都是**测试**文件，其中的密钥/证书均为运行时生成的假值；
# 被排除的路径连 push protection 也会跳过，故不会引入真实泄露风险。
# 注意：仅排除这三个文件，backend/app/ 与其余测试仍照常扫描——避免为了降噪而留下盲区。
paths-ignore:
  - "backend/tests/test_payments.py"       # 微信/支付宝签名夹具（"k"*32 APIv3 密钥等）
  - "backend/tests/test_refund_channel.py" # 退款渠道测试，同样的支付夹具
  - "backend/tests/test_deploy_tls.py"     # 启动校验测试含 WECHAT_API_V3_KEY 夹具
